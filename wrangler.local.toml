name = "stockroom-local"
main = "src/worker.local.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "stockroom-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
