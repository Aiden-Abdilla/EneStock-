<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stockroom | Stock</title><link rel="stylesheet" href="/style.css"></head><body><main>
<header><h1>Stockroom <span> / Stock</span></h1><p>Barcode-driven stock movements</p></header>
<section class="panel"><div class="mode"><button id="in" type="button">＋ Stock In</button><button id="out" type="button">－ Stock Out</button><strong id="modeLabel" aria-live="polite">Select a mode before scanning</strong></div>
<label for="scan">Scan barcode or type and press Enter</label><input id="scan" autocomplete="off" spellcheck="false" placeholder="Select Stock In or Stock Out first" disabled><p id="feedback" role="status" aria-live="polite"></p></section>
<section class="panel"><div class="sectionhead"><h2>Stock</h2><button id="showAdd" type="button" class="secondary">Register Item</button></div><div id="add" hidden><form id="addForm"><label for="name">Item name</label><input id="name" maxlength="200" required><label for="barcode">Barcode (type or scan)</label><input id="barcode" maxlength="128" autocomplete="off" required><button type="submit">Save new item (quantity 0)</button></form><p id="addStatus" role="status"></p></div>
<input id="search" aria-label="Search stock" placeholder="Search item name or barcode"><div class="scroll"><table><thead><tr><th>Item name</th><th>Barcode</th><th>Quantity on hand</th></tr></thead><tbody id="items"></tbody></table></div></section>
<section class="panel"><div class="sectionhead"><h2>Movement history &amp; reports</h2><button id="csv" class="secondary">Export CSV</button></div><div class="range"><label>Start date<input type="date" id="start"></label><label>End date (inclusive)<input type="date" id="end"></label><button id="apply" class="secondary">Apply dates</button></div><p id="totals" aria-live="polite"></p><div class="scroll"><table><thead><tr><th>Time (Malta)</th><th>Item</th><th>Barcode</th><th>Direction</th><th>Units</th><th>Balance</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script type="module" src="/app.js"></script></body></html>
