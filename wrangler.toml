name = "stockroom-worker"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "enestock.abdilla.net", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "stockroom-db"
database_id = "3a6a7155-675a-42e2-b195-756de0762431"
migrations_dir = "migrations"

[vars]
# Set to https://YOUR-TEAM.cloudflareaccess.com (HTTPS, no trailing slash).
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_ACCESS_TEAM_DOMAIN"
# Cloudflare Access application AUD tag (not the application ID).
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"

